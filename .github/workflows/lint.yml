name: Linting
permissions:
  contents: read
on: [push, pull_request]

jobs:
  selene:
    name: selene
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NTBBloodbath/selene-action is no longer available; install the
      # pinned release directly.
      - name: Install selene
        # renovate: datasource=github-releases depName=Kampfkarren/selene
        env:
          SELENE_VERSION: 0.32.0
        run: |
          curl --silent --show-error --location \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip" \
            --output selene.zip
          unzip -q selene.zip
          sudo install selene /usr/local/bin/selene
      # selene arguments, should be the same as in ../../mise.toml
      - name: Run selene
        run: selene --display-style=quiet ./lua/ ./spec/ ./integration-tests/test-environment/config-modifications

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-26.04
    steps:
      # https://github.com/rvben/rumdl?tab=readme-ov-file#github-actions
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rvben/rumdl@41e15c580461c971819816143d4e43c636647674 # v0

  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: actionlint
        uses: kjanat/actionlint@220b76cfa568e00ed8b3c476898f849a722b88e2 # v1.17.1

  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # https://github.com/pnpm/action-setup?tab=readme-ov-file#use-cache-to-reduce-installation-time
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: pnpm run lint
