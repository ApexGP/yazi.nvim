name: Sync upstream

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # The upstream remote makes gh default to mikavilpas/yazi.nvim; target
      # the fork explicitly for issue/label commands.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/mikavilpas/yazi.nvim.git 2>/dev/null || true
          git fetch upstream main

      - name: Compare baseline
        id: baseline
        run: |
          if [ -f .github/upstream-baseline.txt ]; then
            baseline="$(cat .github/upstream-baseline.txt)"
          else
            baseline="$(git merge-base origin/main upstream/main)"
          fi
          count="$(git rev-list --count "${baseline}..upstream/main")"
          {
            echo "value=${baseline}"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"
          echo "baseline=${baseline}, new commits=${count}"

      - name: Nothing to sync
        if: steps.baseline.outputs.count == '0'
        run: echo "No new upstream commits since ${{ steps.baseline.outputs.value }}"

      - name: Fetch sync history
        if: steps.baseline.outputs.count != '0'
        run: git fetch origin sync/history:refs/remotes/origin/sync/history --force || true

      - name: Prepare sync history
        if: steps.baseline.outputs.count != '0'
        id: sync
        run: |
          sha="$(git rev-parse upstream/main)"
          short="$(git rev-parse --short upstream/main)"
          branch="sync/upstream-${short}"
          {
            echo "sha=${sha}"
            echo "short=${short}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # sync/history keeps the upstream ancestry; main only gets one
          # squashed commit per sync. Bring new fork-local main commits into
          # the history branch first.
          if git rev-parse --verify refs/remotes/origin/sync/history >/dev/null 2>&1; then
            git checkout -B sync/history refs/remotes/origin/sync/history
            git merge --no-edit -X theirs main
          else
            git checkout -B sync/history main
          fi
          git branch -f "${branch}" sync/history

      - name: Merge upstream
        if: steps.baseline.outputs.count != '0'
        id: merge
        continue-on-error: true
        run: |
          if ! git merge --no-ff --no-commit --no-edit upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              echo "Merge failed without conflicting files"
              exit 1
            fi

            non_workflow="$(printf '%s\n' "$conflicts" | grep -v '^\.github/workflows/' || true)"
            if [ -n "$non_workflow" ]; then
              echo "Conflicts outside .github/workflows:"
              printf '%s\n' "$non_workflow"
              exit 1
            fi
          fi

          # GITHUB_TOKEN is not allowed to push changes to .github/workflows.
          # This fork's workflows intentionally differ from upstream, so restore
          # them from main and fold that into the merge commit.
          git rm -r --quiet -f .github/workflows
          git checkout main -- .github/workflows
          git add .github/workflows
          echo "${{ steps.sync.outputs.sha }}" > .github/upstream-baseline.txt
          git add .github/upstream-baseline.txt
          if git diff --cached --quiet && git diff --quiet; then
            echo "sync/history already contains the upstream changes"
          else
            git commit --no-edit
          fi

      - name: Record conflicts and abort
        if: steps.baseline.outputs.count != '0' && steps.merge.outcome != 'success'
        run: |
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
          git merge --abort 2>/dev/null || true
          git branch -f "${{ steps.sync.outputs.branch }}" sync/history
          git push origin "refs/heads/${{ steps.sync.outputs.branch }}" --force

      - name: Install Rust
        if: steps.baseline.outputs.count != '0' && steps.merge.outcome == 'success'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install stylua
        if: steps.baseline.outputs.count != '0' && steps.merge.outcome == 'success'
        run: cargo install stylua --locked

      - name: Install Neovim
        if: steps.baseline.outputs.count != '0' && steps.merge.outcome == 'success'
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable

      - name: Run checks
        if: steps.baseline.outputs.count != '0' && steps.merge.outcome == 'success'
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "== stylua =="
            stylua --check lua spec
            echo "== load plugin =="
            nvim --headless -u NONE --cmd 'set rtp+=.' -c 'lua assert(require("yazi"))' +qa
          } 2>&1 | tee /tmp/test.log

      - name: Push merge that needs attention
        if: steps.baseline.outputs.count != '0' && steps.merge.outcome == 'success' && steps.test.outcome != 'success'
        run: |
          git branch -f "${{ steps.sync.outputs.branch }}" sync/history
          git push origin "refs/heads/${{ steps.sync.outputs.branch }}" --force

      - name: Publish successful sync
        if: steps.baseline.outputs.count != '0' && steps.merge.outcome == 'success' && steps.test.outcome == 'success'
        id: publish
        env:
          SHORT: ${{ steps.sync.outputs.short }}
        run: |
          # main gets one squashed commit; sync/history keeps the upstream
          # ancestry and is pushed for the next incremental merge.
          tree="$(git rev-parse "sync/history^{tree}")"
          commit="$(git commit-tree "${tree}" -p main -m "chore(sync): upstream ${SHORT}")"
          git checkout -B main "${commit}"
          git push origin sync/history
          git push origin main

      - name: Create issue on failure
        if: >
          steps.baseline.outputs.count != '0' && (failure() || steps.merge.outcome != 'success' || steps.test.outcome !=
          'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream sync failed at ${{ steps.sync.outputs.short }}"
          if [ "$(gh issue list -R "${{ github.repository }}" --state open --search "${title} in:title" --json number --jq 'length')" -ne 0 ]; then
            echo "An open issue already exists for ${title}."
            exit 0
          fi
          gh label create upstream-sync -R "${{ github.repository }}" --color FBCA04 --description "Upstream sync needs manual attention" || true
          label_args=()
          if gh label view upstream-sync -R "${{ github.repository }}" >/dev/null 2>&1; then
            label_args=(--label upstream-sync)
          fi
          {
            echo "The scheduled upstream sync could not update this fork."
            echo
            echo "- Baseline: \`${{ steps.baseline.outputs.value }}\`"
            echo "- Upstream head: \`${{ steps.sync.outputs.sha }}\`"
            echo "- Sync branch: \`${{ steps.sync.outputs.branch }}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Failure stage"
            echo "- merge: \`${{ steps.merge.outcome }}\`"
            echo "- checks: \`${{ steps.test.outcome }}\`"
            echo "- publish: \`${{ steps.publish.outcome }}\`"
            echo
            echo "## Upstream commits"
            echo '```'
            git log --oneline "${{ steps.baseline.outputs.value }}..upstream/main" | head -50
            echo '```'
            echo
            echo "## Conflict files"
            echo '```'
            cat /tmp/conflicts.txt 2>/dev/null || echo "(no merge conflict)"
            echo '```'
            echo
            echo "## Test log"
            echo '<details><summary>stylua / nvim output</summary>'
            echo
            echo '```'
            tail -200 /tmp/test.log 2>/dev/null || echo "(no test log)"
            echo '```'
            echo
            echo '</details>'
            echo
            echo "## How to resolve locally"
            echo '```sh'
            echo "git fetch origin"
            echo "git fetch upstream"
            echo "git checkout -B ${{ steps.sync.outputs.branch }} origin/${{ steps.sync.outputs.branch }}"
            echo "git merge upstream/main"
            echo "# then verify"
            echo "stylua --check lua spec"
            echo "mise test"
            echo "git push origin ${{ steps.sync.outputs.branch }}"
            echo '```'
            echo
            echo "main receives one squashed commit per sync; upstream ancestry is kept on the \`sync/history\` branch."
            echo
            echo "This is a personal fork maintained by ApexGP."
          } > /tmp/issue.md
          gh issue create \
            -R "${{ github.repository }}" \
            --title "${title}" \
            --body-file /tmp/issue.md \
            "${label_args[@]}" \
            --assignee "${{ github.repository_owner }}"
